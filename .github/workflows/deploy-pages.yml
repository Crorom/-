name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'game.html'
      - 'cars.html'
      - 'world.html'
      - 'game.js'
      - 'styles.css'
      - 'music/**'
      - 'car_image/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN 권한 (Pages 배포에 필요)
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 방지: 한 번에 하나만 배포
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage web files only
        run: |
          mkdir -p _site
          # 게임 콘텐츠만 골라서 복사 (Android, 영상, PSD, GDD 등 제외)
          for f in index.html game.html cars.html world.html game.js styles.css; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d "music" ]; then cp -r music _site/; fi
          if [ -d "car_image" ]; then cp -r car_image _site/; fi
          echo "=== _site/ contents ==="
          ls -la _site/
          du -sh _site/ || true

      - name: Disable Jekyll (GitHub Pages가 폴더 그대로 서빙하도록)
        run: touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
